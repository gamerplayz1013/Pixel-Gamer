// ---------- Tic-Tac-Toe ----------
function ttt(mode){const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let b=Array(9).fill(''),turn='X',done=false;
 const win=(b,p)=>W.some(w=>w.every(i=>b[i]===p)),full=b=>b.every(v=>v);
 function mm(b,p){if(win(b,'O'))return 1;if(win(b,'X'))return -1;if(full(b))return 0;let best=p==='O'?-2:2;for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const s=mm(b,p==='O'?'X':'O');b[i]='';best=p==='O'?Math.max(best,s):Math.min(best,s)}return best}
 function ai(){let bi=-1,bs=-2;for(let i=0;i<9;i++)if(!b[i]){b[i]='O';const s=mm(b,'X');b[i]='';if(s>bs){bs=s;bi=i}}return bi}
 function bot(){const e=[...b.keys()].filter(i=>!b[i]);for(const p of['O','X'])for(const i of e){b[i]=p;const w=win(b,p);b[i]='';if(w)return i}return e[Math.floor(Math.random()*e.length)]}
 const label={ai:'You (X) vs unbeatable AI',bot:'You (X) vs Blix_77',friend:'Player X vs Player O (take turns)'}[mode];
 let built=0;function draw(m){if(!built){built=1;$('#stage').innerHTML=`<p>${label}</p><div class="tb">${[0,3,6].map(r=>[0,1,2].map(c=>`<button class="cell" data-i="${r+c}" onclick="G.act(${r+c})"></button>`).join('')).join('<br>')}</div><p id="tst" class="tst"></p>`}
  document.querySelectorAll('.cell').forEach(c=>{c.textContent=b[+c.dataset.i]});$('#tst').textContent=m||(turn+"'s turn")}
 function end(){let m;if(win(b,'X'))m=mode==='friend'?'Player X wins!':'You win!';else if(win(b,'O'))m=mode==='friend'?'Player O wins!':'You lost';else if(full(b))m='Draw';else return false;done=true;draw(m);
  const w=win(b,'X')&&mode!=='friend';fin(w?40:mode==='friend'?15:15,w?10:2,m);return true}
 G.act=i=>{if(done||typeof i!=='number'||b[i])return;b[i]=turn;SFX.play(turn==='X'?'pop':'pop2');if(end())return;turn=turn==='X'?'O':'X';if(mode!=='friend'&&turn==='O'){b[mode==='ai'?ai():bot()]='O';SFX.play('pop2');if(end())return;turn='X'}draw()};
 draw()}

function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;const W=c.width,H=c.height,gap=Math.max(150,H*.28),px=W*.25;
  if(alive){vy+=1100*dt;y+=vy*dt;spawn-=dt;
    if(spawn<=0){spawn=1.5;pipes.push({x:W+40,g:90+Math.random()*Math.max(10,H-gap-180),p:false})}
    pipes.forEach(p=>{p.x-=190*dt;
      if(!p.p&&p.x+60<px){p.p=true;score++;PG.score(score);PG.sfx('coin')}
      if(px+14>p.x&&px-14<p.x+60&&(y-14<p.g||y+14>p.g+gap)){alive=false;PG.sfx('crash')}});
    pipes=pipes.filter(p=>p.x>-80);

  x.fillStyle='#fff';x.font='bold 36px system-ui';x.textAlign='center';x.fillText(String(score),W/2,60);

{id:'snake',e:'🐍',n:'Snake',d:'Eat apples, grow longer, do not bite yourself.',t:'2d',code:`// Snake - arrow keys / WASD, or swipe on a phone.
const c=document.getElementById('game'),x=c.getContext('2d');
function fit(){c.width=innerWidth;c.height=innerHeight}fit();onresize=fit;
const N=20;let snake=[],dir={x:1,y:0},nd=dir,food={x:5,y:5},score=0,alive=true,acc=0,last=performance.now(),sx=0,sy=0;
function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nd=dir;score=0;alive=true;place()}
reset();
function turn(dx,dy){if(!alive){reset();return}if(dx!==-dir.x||dy!==-dir.y){if(dx!==0||dy!==0)nd={x:dx,y:dy}}}
onkeydown=e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')turn(-1,0);else if(k==='ArrowRight'||k==='d')turn(1,0);else if(k==='ArrowUp'||k==='w')turn(0,-1);else if(k==='ArrowDown'||k==='s')turn(0,1)};
onpointerdown=e=>{sx=e.clientX;sy=e.clientY;if(!alive)reset()};
onpointerup=e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1)};
function loop(t){const dt=Math.min(.1,(t-last)/1000);last=t;
  if(alive){acc+=dt;while(acc>.11){acc-=.11;dir=nd;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){alive=false;PG.sfx('crash');break}
    snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;PG.score(score);PG.sfx('coin');place()}else snake.pop()}}
  const W=c.width,H=c.height,s=Math.min(W,H-60)/N,ox=(W-s*N)/2,oy=50;
  x.fillStyle='#0b0d2b';x.fillRect(0,0,W,H);x.fillStyle='#16204f';x.fillRect(ox,oy,s*N,s*N);
  x.fillStyle='#ff4f4f';x.fillRect(ox+food.x*s+2,oy+food.y*s+2,s-4,s-4);
  snake.forEach((p,i)=>{x.fillStyle=i?'#5df2c8':'#ffd84a';x.fillRect(ox+p.x*s+1,oy+p.y*s+1,s-2,s-2)});
  x.fillStyle='#fff';x.font='bold 22px system-ui';x.textAlign='left';x.fillText('Score '+score,ox,32);
  if(!alive){x.font='bold 28px system-ui';x.textAlign='center';x.fillText('Game over - tap to retry',W/2,H/2)}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
`},
{id:'space',e:'🚀',n:'Space Shooter',d:'Blast the asteroids. Your ship fires by itself.',t:'2d',code:`// Space Shooter - move with mouse / finger / arrow keys. The ship fires automatically.
const c=document.getElementById('game'),x=c.getContext('2d');
function fit(){c.width=innerWidth;c.height=innerHeight}fit();onresize=fit;
let px=c.width/2,bullets=[],rocks=[],score=0,lives=3,fire=0,spawn=0,keys={},last=performance.now(),over=false;
onkeydown=e=>keys[e.key]=1;onkeyup=e=>delete keys[e.key];
onpointermove=e=>{px=e.clientX};
onpointerdown=e=>{px=e.clientX;if(over){over=false;score=0;lives=3;rocks=[];bullets=[]}};
function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;const W=c.width,H=c.height,py=H-70;
  if(keys.ArrowLeft||keys.a)px-=460*dt;if(keys.ArrowRight||keys.d)px+=460*dt;px=Math.max(20,Math.min(W-20,px));
  if(!over){fire-=dt;if(fire<=0){fire=.22;bullets.push({x:px,y:py-20});PG.sfx('shoot')}
    spawn-=dt;if(spawn<=0){spawn=Math.max(.25,.9-score*.01);rocks.push({x:30+Math.random()*(W-60),y:-30,r:14+Math.random()*16,v:90+Math.random()*90+score})}
    bullets.forEach(b=>b.y-=520*dt);bullets=bullets.filter(b=>b.y>-10);
    rocks.forEach(r=>r.y+=r.v*dt);
    rocks=rocks.filter(r=>{let hit=false;bullets.forEach(b=>{if(!hit&&Math.hypot(b.x-r.x,b.y-r.y)<r.r+4){hit=true;b.y=-99}});
      if(hit){score++;PG.score(score);PG.sfx('hit');return false}
      if(Math.hypot(px-r.x,py-r.y)<r.r+14){lives--;PG.sfx('crash');if(lives<=0){over=true;PG.sfx('lose')}return false}
      return r.y<H+40})}
  x.fillStyle='#050722';x.fillRect(0,0,W,H);
  x.fillStyle='#ffd84a';bullets.forEach(b=>x.fillRect(b.x-2,b.y,4,12));
  x.fillStyle='#9aa4c7';rocks.forEach(r=>{x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.fill()});
  x.fillStyle='#5df2c8';x.beginPath();x.moveTo(px,py-20);x.lineTo(px-16,py+14);x.lineTo(px+16,py+14);x.fill();
  x.fillStyle='#fff';x.font='bold 20px system-ui';x.textAlign='left';x.fillText('Score '+score+'   Lives '+lives,12,30);
  if(over){x.font='bold 30px system-ui';x.textAlign='center';x.fillText('Game over - tap to retry',W/2,H/2)}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
`},
{id:'runner',e:'🦖',n:'Dino Runner',d:'Jump over the cacti. It gets faster and faster!',t:'2d',code:`// Dino Runner - tap / click / Space / Up arrow to jump.

function jump(){if(!alive){y=0;vy=0;obs=[];score=0;speed=260;alive=true;spawn=1;return}if(y===0){vy=620;PG.sfx('jump')}}

function loop(t){const dt=Math.min(.03,(t-last)/1000);last=t;const W=c.width,H=c.height,gy=H*.72,dx=80;
  if(alive){vy-=1700*dt;y=Math.max(0,y+vy*dt);if(y===0)vy=0;speed+=dt*8;score+=dt*speed/40;

  x.fillStyle='#ffe9a8';x.fillRect(0,0,W,H);x.fillStyle='#c9a45a';x.fillRect(0,gy,W,H-gy);

{id:'mole',e:'🔨',n:'Whack-a-Mole',d:'Tap the moles as fast as you can. 30 seconds!',t:'2d',code:`// Whack-a-Mole - tap or click the moles when they pop up!
const c=document.getElementById('game'),x=c.getContext('2d');
function fit(){c.width=innerWidth;c.height=innerHeight}fit();onresize=fit;
let holes=[0,0,0,0,0,0,0,0,0],score=0,time=30,spawn=0,last=performance.now(),over=false;
function geo(){const W=c.width,H=c.height,s=Math.min(W,H-80)/3.4;return{s:s,ox:(W-s*3)/2,oy:70+(H-80-s*3)/2}}
onpointerdown=e=>{if(over){holes=[0,0,0,0,0,0,0,0,0];score=0;time=30;over=false;return}
  const g=geo();for(let i=0;i<9;i++){const cx=g.ox+(i%3+.5)*g.s,cy=g.oy+(Math.floor(i/3)+.5)*g.s;
    if(holes[i]>0&&Math.hypot(e.clientX-cx,e.clientY-cy)<g.s*.4){holes[i]=0;score++;PG.score(score);PG.sfx('hit')}}};
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;const W=c.width,H=c.height,g=geo();
  if(!over){time-=dt;if(time<=0){time=0;over=true;PG.sfx('win')}
    spawn-=dt;if(spawn<=0){spawn=Math.max(.35,.8-score*.01);holes[Math.floor(Math.random()*9)]=1.1}
    for(let i=0;i<9;i++)if(holes[i]>0)holes[i]=Math.max(0,holes[i]-dt)}
  x.fillStyle='#2e7d32';x.fillRect(0,0,W,H);
  for(let i=0;i<9;i++){const cx=g.ox+(i%3+.5)*g.s,cy=g.oy+(Math.floor(i/3)+.5)*g.s;

    if(holes[i]>0){x.fillStyle='#8d6e63';x.beginPath();x.arc(cx,cy-g.s*.05,g.s*.3,0,7);x.fill();x.fillStyle='#000';x.fillRect(cx-g.s*.12,cy-g.s*.12,6,6);x.fillRect(cx+g.s*.06,cy-g.s*.12,6,6)}}
  x.fillStyle='#fff';x.font='bold 24px system-ui';x.textAlign='left';x.fillText('Score '+score+'   Time '+Math.ceil(time),12,36);
  if(over){x.font='bold 30px system-ui';x.textAlign='center';x.fillText('Time up! Score '+score+' - tap to retry',W/2,H/2)}

requestAnimationFrame(loop);
`},
{id:'memory',e:'🃏',n:'Memory Match',d:'Flip the cards and find all the matching pairs.',t:'2d',code:`// Memory Match - tap two cards to find a pair. Fewer moves = higher score!
const c=document.getElementById('game'),x=c.getContext('2d');
function fit(){c.width=innerWidth;c.height=innerHeight}fit();onresize=fit;
const COL=['#ff4f9a','#ffd84a','#5df2c8','#4aa8ff','#ff9f43','#b388ff','#7cff6b','#ff6b6b'];
let cards=[],open=[],moves=0,lock=0,done=false;
function deal(){const a=[];for(let i=0;i<8;i++){a.push(i);a.push(i)}for(let i=15;i>0;i--){const j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}
  cards=a.map(v=>({v:v,up:false,ok:false}));open=[];moves=0;lock=0;done=false}
deal();
function geo(){const W=c.width,H=c.height,s=Math.min(W,H-70)/4.3;return{s:s,ox:(W-s*4)/2,oy:60+(H-70-s*4)/2}}
onpointerdown=e=>{if(done){deal();return}if(lock)return;const g=geo();
  for(let i=0;i<16;i++){const cx=g.ox+(i%4)*g.s,cy=g.oy+Math.floor(i/4)*g.s;
    if(e.clientX>cx&&e.clientX<cx+g.s-6&&e.clientY>cy&&e.clientY<cy+g.s-6&&!cards[i].up&&!cards[i].ok){
      cards[i].up=true;open.push(i);PG.sfx('pop');
      if(open.length===2){moves++;const a=cards[open[0]],b=cards[open[1]];
        if(a.v===b.v){a.ok=b.ok=true;open=[];PG.sfx('coin');if(cards.every(k=>k.ok)){done=true;PG.score(Math.max(1,200-moves*10));PG.sfx('win')}}
        else{lock=1;setTimeout(()=>{a.up=b.up=false;open=[];lock=0},700)}}}}};
function loop(){const W=c.width,H=c.height,g=geo();x.fillStyle='#0b0d2b';x.fillRect(0,0,W,H);
  cards.forEach((k,i)=>{const cx=g.ox+(i%4)*g.s,cy=g.oy+Math.floor(i/4)*g.s;
    x.fillStyle=k.up||k.ok?COL[k.v]:'#2a3270';x.fillRect(cx,cy,g.s-6,g.s-6);
    if(!k.up&&!k.ok){x.fillStyle='#4a58b8';x.font='bold '+Math.floor(g.s*.5)+'px system-ui';x.textAlign='center';x.fillText('?',cx+g.s/2-3,cy+g.s*.65)}});
  x.fillStyle='#fff';x.font='bold 22px system-ui';x.textAlign='left';x.fillText('Moves '+moves,12,34);
  if(done){x.font='bold 28px system-ui';x.textAlign='center';x.fillText('You did it in '+moves+' moves! Tap to replay',W/2,H-14)}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
`},
{id:'cubes3d',e:'🧊',n:'Cube Catcher 3D',d:'Fly into the cubes. Gold ones are worth 5!',t:'3d',code:TPL['3d']},
{id:'orbs3d',e:'🔮',n:'Orb Hunt 3D',d:'Roll your ball around the arena and grab the glowing orbs.',t:'3d',code:`// Orb Hunt 3D - move with arrow keys / WASD, or drag on a phone. Grab the orbs before time runs out!
const c=document.getElementById('game'),r=new THREE.WebGLRenderer({canvas:c,antialias:true});
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0d2b);
const cam=new THREE.PerspectiveCamera(60,1,.1,100);cam.position.set(0,12,10);cam.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x303a78,1));
const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshLambertMaterial({color:0x1b2466}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.6,16,12),new THREE.MeshLambertMaterial({color:0xff4f9a}));ball.position.y=.6;scene.add(ball);
let orbs=[],score=0,time=40,keys={},tx=null,tz=null,last=performance.now();
function addOrb(){const m=new THREE.Mesh(new THREE.SphereGeometry(.4,12,10),new THREE.MeshLambertMaterial({color:0xffd84a}));m.position.set((Math.random()-.5)*17,.5,(Math.random()-.5)*17);scene.add(m);orbs.push(m)}
for(let i=0;i<5;i++)addOrb();
onkeydown=e=>keys[e.key]=1;onkeyup=e=>delete keys[e.key];
function pt(e){tx=(e.clientX/innerWidth-.5)*20;tz=(e.clientY/innerHeight-.5)*20}
onpointerdown=pt;onpointermove=e=>{if(e.buttons)pt(e)};onpointerup=()=>{tx=null;tz=null};
function fit(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}fit();onresize=fit;
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  if(time>0){time-=dt;let dx=0,dz=0;
    if(keys.ArrowLeft||keys.a)dx-=1;if(keys.ArrowRight||keys.d)dx+=1;if(keys.ArrowUp||keys.w)dz-=1;if(keys.ArrowDown||keys.s)dz+=1;
    if(tx!==null){dx=tx-ball.position.x;dz=tz-ball.position.z;const l=Math.hypot(dx,dz);if(l>.3){dx/=l;dz/=l}else{dx=0;dz=0}}
    ball.position.x=Math.max(-9.4,Math.min(9.4,ball.position.x+dx*9*dt));ball.position.z=Math.max(-9.4,Math.min(9.4,ball.position.z+dz*9*dt));
    orbs=orbs.filter(o=>{o.rotation.y+=dt*3;if(Math.hypot(o.position.x-ball.position.x,o.position.z-ball.position.z)<1){scene.remove(o);score++;PG.score(score);PG.sfx('coin');addOrb();return false}return true})}
  else if(time<=0&&!window.fin){window.fin=1;PG.sfx('win')}
  r.render(scene,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
`},
{id:'lanes3d',e:'🏁',n:'Lane Runner 3D',d:'Switch lanes to dodge the blocks racing towards you.',t:'3d',code:`// Lane Runner 3D - arrow keys / A and D to switch lanes, or tap the left / right side of the screen.
const c=document.getElementById('game'),r=new THREE.WebGLRenderer({canvas:c,antialias:true});
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0d2b);scene.fog=new THREE.Fog(0x0b0d2b,12,55);
const cam=new THREE.PerspectiveCamera(65,1,.1,100);cam.position.set(0,3.2,6);cam.lookAt(0,0,-8);
scene.add(new THREE.HemisphereLight(0xffffff,0x303a78,1));
const road=new THREE.Mesh(new THREE.PlaneGeometry(9,120),new THREE.MeshLambertMaterial({color:0x1b2466}));road.rotation.x=-Math.PI/2;road.position.z=-40;scene.add(road);
const car=new THREE.Mesh(new THREE.BoxGeometry(1.2,.8,2),new THREE.MeshLambertMaterial({color:0xff4f9a}));car.position.set(0,.5,2);scene.add(car);
let lane=1,blocks=[],score=0,speed=14,alive=true,spawn=0,last=performance.now();
function go(d){if(!alive){reset();return}lane=Math.max(0,Math.min(2,lane+d));PG.sfx('pop')}
function reset(){blocks.forEach(b=>scene.remove(b));blocks=[];score=0;speed=14;alive=true;lane=1}
onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='a')go(-1);if(e.key==='ArrowRight'||e.key==='d')go(1)};
onpointerdown=e=>go(e.clientX<innerWidth/2?-1:1);
function fit(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}fit();onresize=fit;
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  car.position.x+=((lane-1)*3-car.position.x)*Math.min(1,12*dt);
  if(alive){speed+=dt*.5;score+=dt*speed;spawn-=dt;
    if(spawn<=0){spawn=Math.max(.35,1.1-score*.0008);const b=new THREE.Mesh(new THREE.BoxGeometry(2,1.2,1.2),new THREE.MeshLambertMaterial({color:0x5df2c8}));b.position.set((Math.floor(Math.random()*3)-1)*3,.6,-60);scene.add(b);blocks.push(b)}
    blocks=blocks.filter(b=>{b.position.z+=speed*dt;
      if(Math.abs(b.position.z-2)<1.6&&Math.abs(b.position.x-car.position.x)<1.6){alive=false;PG.sfx('crash')}
      if(b.position.z>8){scene.remove(b);return false}return true});
    if(Math.floor(score)%5===0)PG.score(Math.floor(score))}
  r.render(scene,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
`},
{id:'pydodge',e:'🐍',n:'Python Dodger',d:'Dodge the falling blocks — written in Python.',t:'py',code:[
'# Python Dodger - move left/right to dodge the falling blocks!',
'import pg',
'import random',
'',
'px = 200',
'blocks = []',
'score = 0.0',
'spawn = 0',
'alive = True',
'',
'def frame(dt):',
'    global px, score, spawn, alive',
'    w, h = pg.size()',
'    mx, my, down = pg.mouse()',
'    if alive:',
'        if pg.key("left") or pg.key("a"):',
'            px -= 420 * dt',
'        if pg.key("right") or pg.key("d"):',
'            px += 420 * dt',
'        if down:',
'            px = mx',
'        px = max(24, min(w - 24, px))',
'        score += dt * 10',
'        spawn -= dt',
'        if spawn <= 0:',
'            spawn = max(0.25, 0.9 - score * 0.002)',
'            blocks.append([random.random() * (w - 50) + 25, -20])',
'        for b in blocks[:]:',
'            b[1] += 260 * dt',
'            if abs(b[0] - px) < 30 and abs(b[1] - (h - 50)) < 24:',
'                alive = False',
'                pg.score(int(score))',
'                pg.sfx("hit")',
'            elif b[1] > h + 20:',
'                blocks.remove(b)',
'    pg.clear("#0b0d2b")',
'    for b in blocks:',
'        pg.rect(b[0] - 18, b[1] - 10, 36, 20, "#ff4f9a")',
'    pg.rect(px - 22, h - 46, 44, 16, "#4fd1ff")',
'    pg.text("Score: " + str(int(score)), 14, 30, "#ffffff", 22)',
'    if not alive:',
'        pg.text("Game over! Score " + str(int(score)), w / 2 - 130, h / 2, "#ffffff", 26)',
'',
'pg.run(frame)',
''].join(String.fromCharCode(10))},
{id:'htmlquiz',e:'🌐',n:'Quick Quiz',d:'A multiple-choice quiz page built with HTML, CSS and JS.',t:'html',code:[

  sp-=dt;if(sp<=0){sp=Math.max(.3,.62-(45-t)*.007);const bad=Math.random()<.32,L=bad?g.bad:g.good;it.push({x:24+Math.random()*(W-48),y:-20,v:120+Math.random()*70+(45-t)*3.2,e:L[Math.floor(Math.random()*L.length)],bad,i:bad?0:g.good.indexOf(L[0])})}
  for(const o of it){o.y+=o.v*dt;if(!o.hit&&o.y>H2-70&&o.y<H2-14&&Math.abs(o.x-px)<36){o.hit=1;if(o.bad){lives--;fl=.25;try{SFX.play('crash')}catch(e){}}else{sc+=o.e===g.good[0]?15:10;try{SFX.play('pop')}catch(e){}}}}
  it=it.filter(o=>!o.hit&&o.y<H2+30);fl=Math.max(0,fl-dt);
  x.clearRect(0,0,W,H2);if(fl>0){x.fillStyle='rgba(255,40,40,'+fl*1.4+')';x.fillRect(0,0,W,H2)}
  x.textAlign='center';x.textBaseline='middle';x.font='30px serif';it.forEach(o=>x.fillText(o.e,o.x,o.y));x.font='44px serif';x.fillText(g.pl,px,H2-36);hud()}
 hud();G.iv=setInterval(step,16)};
