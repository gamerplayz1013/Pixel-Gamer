lb:()=>{const gl=GM.concat(UG.map(g=>['ug_'+g.id,'🧑‍💻 '+g.title,[['best','Top score'],['g','Times played']]])),cur=gl.find(x=>x[0]===LBG)||gl[0],ms=cur[2],cm=ms.find(m=>m[0]===LBM)||ms[0];return `<div class="card"><h2>🏅 Leaderboards · Top 15</h2><small>Real players on this device. Play a game to get on the board!</small><div class="chips">${gl.map(x=>`<button class="${x[0]===cur[0]?'on':''}" onclick="lbSet('${x[0]}')">${esc(x[1])}</button>`).join('')}</div><div class="chips">${ms.map(m=>`<button class="${m[0]===cm[0]?'on':''}" onclick="lbMet('${m[0]}')">${m[1]}</button>`).join('')}</div><h2>${esc(cur[1])} — ${cm[1]}</h2>${LBL.length?LBL.map((r,i)=>`<div class="lbr ${r.name===S.name?'me':''}"><span style="color:#fff"><b>${i<3?['🥇','🥈','🥉'][i]:(i+1)+'.'}</b> ${RB(r.role)}${esc(r.name)}${r.vip?' ⭐':''}</span><span>${r.v.toLocaleString()}</span></div>`).join(''):'<p>No scores yet — be the first!</p>'}</div>`},
mk:()=>{if(!ED.code)ED.code=TPL[ED.type];const mine=UG.filter(g=>g.mine);return `${TPK?tplPick():''}<div class="card"><h2>🛠 Game Maker</h2><p><small>Write real JavaScript — 2D with canvas or 3D with three.js. When someone opens your game it says <b>Created by ${esc(S.name)}</b>. Call <code>PG.score(n)</code> to send scores to the leaderboard and <code>PG.sfx('coin')</code> for sounds (coin, jump, hit, win, lose, shoot, pop, ping, crash). Games run in a safe sandbox (no internet, no access to accounts).</small></p><input id="gt" maxlength="30" placeholder="Game title (3-30 letters)" value="${esc(ED.title)}"><input id="gd" maxlength="120" placeholder="Short description" value="${esc(ED.desc)}"><div class="chips"><button class="${ED.type==='2d'?'on':''}" onclick="edType('2d')">2D · canvas</button><button class="${ED.type==='3d'?'on':''}" onclick="edType('3d')">3D · three.js</button></div><textarea id="gc" class="code" spellcheck="false" autocapitalize="off" autocorrect="off" onkeydown="if(event.key==='Tab'){event.preventDefault();this.setRangeText('  ',this.selectionStart,this.selectionEnd,'end')}">${esc(ED.code)}</textarea><div class="row"><button onclick="edTest()">▶ Test</button><button onclick="edPub()">🚀 ${ED.id?'Update':'Publish'}</button><button onclick="edNew()">✨ New</button></div></div><div id="edprev"></div><h2>My games</h2>${mine.length?mine.map(g=>`<div class="card row" style="justify-content:space-between"><span><b>${esc(g.title)}</b> <small>${g.type.toUpperCase()}</small></span><span><button onclick="ugOpen('${g.id}')">▶</button><button onclick="edLoad('${g.id}')">✏️</button><button onclick="ugDel('${g.id}')">🗑</button></span></div>`).join(''):'<p>You have not made a game yet.</p>'}`},
adm:()=>{const lab=S.role==='sub'?'🌟 Sub Creator':isC()?'👑 Creator':'🛡️ Admin',canBan=x=>x.role!=='creator'&&(x.role==='sub'?isM():x.role==='admin'?isC():true);return `<div class="card"><h2>${lab} panel</h2><input id="an" placeholder="Username"><input id="aa" type="number" min="1" placeholder="Amount (🎮 / XP / levels)"><div class="row"><button onclick="adm('don')">Donate 🎮${isC()?'':' (from you)'}</button>${isC()?'<button onclick="adm(\'donx\')">Donate XP</button><button onclick="adm(\'donl\')">Donate levels</button><button onclick="adm(\'adm\')">Make admin</button><button onclick="adm(\'rev\')">Remove admin</button>':''}${isM()?'<button onclick="adm(\'sub\')">🌟 Make sub creator</button><button onclick="adm(\'unsub\')">Remove sub creator</button>':''}<button onclick="adm(\'ban\')">Ban</button><button onclick="adm(\'unban\')">Unban</button></div>${isC()?'<input id="sn" placeholder="New season name"><button onclick="adm(\'sea\')">Set season</button><input id="cn" placeholder="New promo code"><input id="ca" type="number" placeholder="Promo 🎮 amount"><button onclick="adm(\'code\')">Add promo</button><select id="gx">'+rareOpts()+'</select><button onclick="adm(\'gift\')">🎁 Give rare item</button>':''}${isM()?'':'<small>Only the main creators can ban or unban sub creators.</small>'}</div>${isC()?`<div class="card"><h2>🏷️ Promo codes</h2>${CD.map(c=>`<div class="lbr"><span style="color:#fff;${c.off?'opacity:.5;text-decoration:line-through':''}">${esc(c.c.toUpperCase())} · ${c.v?c.v+' days VIP':c.n+' 🎮'}${c.b?' <small>(built in)</small>':''}${c.off?' <small>(removed)</small>':''}</span><span>${c.off?`<button onclick="delCode('${esc(c.c)}','restorecode')">↩ Restore</button>`:`<button onclick="delCode('${esc(c.c)}')">🗑 Remove</button>`}</span></div>`).join('')||'<small>No codes yet.</small>'}</div>`:''}<div class="card"><h2>Players</h2>${AL.length?AL.map(x=>`<div class="lbr"><span style="color:#fff">${RB(rnC(x.role))}${esc(x.name)} · ${x.role==='creator'||x.role==='sub'?'∞':x.bucks} 🎮${x.banned?' · <b style="color:#ff6b6b">BANNED</b>':''}</span><span>${x.role==='creator'?'':`<button onclick="admU('don','${esc(x.name)}')">🎁</button>${canBan(x)?`<button onclick="admU('${x.banned?'unban':'ban'}','${esc(x.name)}')">${x.banned?'Unban':'Ban'}</button>`:''}`}</span></div>`).join(''):'<p>No other players yet.</p>'}</div>`}};
async function redeem(){const v=(($('#pc')||{}).value||'').trim();if(!v)return toast('Type a code first');const j=await api('promo',{code:v});if(upd(j)){SFX.play('chest');toast(j.vip?'👑 FREE VIP unlocked for '+j.vip+' days!':'🎉 Code accepted! +'+j.got+' 🎮');render()}}
async function delCode(c,a){const j=await api('admin',{a:a||'delcode',code:c});if(upd(j)){toast(a?'Code restored':'Code removed');show('adm')}}
async function addF(){const n=(($('#fn')||{}).value||'').trim();if(!n)return toast('Type a username');const j=await api('friend',{a:'req',u:n});if(upd(j)){SFX.play('buy');toast('Friend request sent to '+n+' ✔');render()}}
async function frAct(a,n){const j=await api('friend',{a,u:n});if(!upd(j))return;SFX.play(a==='acc'?'win':'click');toast(a==='acc'?'You and '+n+' are friends now! 🎉':a==='dec'?'Request declined':a==='rem'?'Friend removed':'Request cancelled');if(tab==='nt'){const k=await api('notif');if(k){NL=k.list;upd(k)}}render()}
const PGN={c4:'Connect Four',rev:'Reversi',bship:'Battleship',ttt:'Tic-Tac-Toe'};
function pgName(id){const m=GM.find(x=>x[0]===id);if(m)return m[1];if(PGN[id])return PGN[id];if(String(id).startsWith('ug_')){const g=UG.find(x=>'ug_'+x.id===id);return g?g.title:'a game made by a player'}return id}
function frStatus(x){if(x.room)return '🎮 Playing '+pgName(x.room.mode)+(x.room.phase==='wait'?' · waiting in the lobby':' · match in progress (join to watch)');if(!x.on)return '⚫ Offline';return x.g?'🎮 Playing '+pgName(x.g):'🟢 Online · in the menus'}
async function joinF(n){const j=await api('friend',{a:'list'});if(!j||!upd(j))return;const f=S.friends.find(x=>x.name===n);if(!f)return toast('Not your friend yet');
 if(f.room){const m=f.room.mode;tab='play';render();go('arena',m);(m==='bw'?(a,b,c)=>bwGo(b,c):m==='tdm'||m==='duel'?shooterGo:arenaGo)(m,'friend',f.name);return}
 if(!f.on)return toast(n+' is offline right now');if(!f.g)return toast(n+' is in the menus - not playing yet');
 const g=f.g;tab='play';render();if(g.startsWith('ug_'))ugOpen(g.slice(3));else if(['kart','sky','tdm','duel','bw'].includes(g))go('arena',g);else go(g,g==='ttt'?'ai':'')}
function specMode(who){G.spec=who;clearInterval(G.inp);G.inp=null;document.querySelectorAll('.ctlrow').forEach(e=>e.style.display='none');const c=$('#cw');if(c&&!$('#specb'))c.insertAdjacentHTML('beforebegin','<div id="specb" class="chip" style="margin:6px 0">👀 Spectating '+esc(who)+' - they are already playing. <button onclick="render()">Leave</button></div>');toast('👀 '+who+' is already playing - you are watching')}
function specEv(e){let r={};try{r=JSON.parse(e.data)}catch(x){}if(r.spec)specMode(r.who);else toast('🎮 Joined '+(r.who?r.who+"'s":'the')+' lobby!')}
function endEv(){if(G.es){G.es.close();G.es=null}clearInterval(G.inp);const a=$('#ar');if(a)a.innerHTML='<p><b>The match ended.</b> <button onclick="render()">Back</button></p>'}

 const old=S.nn||0,oi=(S.reqIn||[]).length,of=JSON.stringify(S.friends.map(f=>[f.name,f.on,f.g,f.room?f.room.mode+f.room.phase:'']));
 S=j.user;const nb=$('#ntb');if(nb)nb.innerHTML='🔔'+(S.nn?' <b class="nb">'+(S.nn>9?'9+':S.nn)+'</b>':'');
 const fb=$('#tb_fr');if(fb)fb.textContent='👥 Friends'+(S.reqIn.length?' 🔴':'');

 const oy=s.py;s.py+=s.vy*dt;let on=null;
 for(const p of L.pl){if(p.gone)continue;if(s.px<p.x+p.w&&s.px+PW>p.x&&s.py<p.y+p.h&&s.py+PH>p.y){if(s.vy>=0&&oy+PH<=p.y+3){s.py=p.y-PH;s.vy=0;on=p}else if(s.vy<0&&oy>=p.y+p.h-3){s.py=p.y+p.h;s.vy=0}}}

function ttt(mode){const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let b=Array(9).fill(''),turn='X',done=false;
 const win=(b,p)=>W.some(w=>w.every(i=>b[i]===p)),full=b=>b.every(v=>v);
 function mm(b,p){if(win(b,'O'))return 1;if(win(b,'X'))return -1;if(full(b))return 0;let best=p==='O'?-2:2;for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const s=mm(b,p==='O'?'X':'O');b[i]='';best=p==='O'?Math.max(best,s):Math.min(best,s)}return best}
 function ai(){let bi=-1,bs=-2;for(let i=0;i<9;i++)if(!b[i]){b[i]='O';const s=mm(b,'X');b[i]='';if(s>bs){bs=s;bi=i}}return bi}
 function bot(){const e=[...b.keys()].filter(i=>!b[i]);for(const p of['O','X'])for(const i of e){b[i]=p;const w=win(b,p);b[i]='';if(w)return i}return e[Math.floor(Math.random()*e.length)]}
 const label={ai:'You (X) vs unbeatable AI',bot:'You (X) vs Bot Blix',friend:'Player X vs Player O (take turns)'}[mode];
 let built=0;function draw(m){if(!built){built=1;$('#stage').innerHTML=`<p>${label}</p><div class="tb">${[0,3,6].map(r=>[0,1,2].map(c=>`<button class="cell" data-i="${r+c}" onclick="G.act(${r+c})"></button>`).join('')).join('<br>')}</div><p id="tst" class="tst"></p>`}
  document.querySelectorAll('.cell').forEach(c=>{c.textContent=b[+c.dataset.i]});$('#tst').textContent=m||(turn+"'s turn")}
 function end(){let m;if(win(b,'X'))m=mode==='friend'?'Player X wins!':'You win!';else if(win(b,'O'))m=mode==='friend'?'Player O wins!':'You lost';else if(full(b))m='Draw';else return false;done=true;draw(m);
  const w=win(b,'X')&&mode!=='friend';fin(w?40:mode==='friend'?15:15,w?10:2,m);return true}
 G.act=i=>{if(done||typeof i!=='number'||b[i])return;b[i]=turn;SFX.play(turn==='X'?'pop':'pop2');if(end())return;turn=turn==='X'?'O':'X';if(mode!=='friend'&&turn==='O'){b[mode==='ai'?ai():bot()]='O';SFX.play('pop2');if(end())return;turn='X'}draw()};
 draw()}
